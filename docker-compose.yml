services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # ANTHROPIC_API_KEY is read from the repo-root .env, which is gitignored. Offline
      # endpoints (/health, /reviews, /traces) work without it.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DOSSIER_GRAPH_BACKEND=${DOSSIER_GRAPH_BACKEND:-networkx}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=dossierdev
    volumes:
      # data/ and runs/ are bind-mounted so an index built on the host is reused in the
      # container rather than rebuilt, and so runs survive a container restart.
      - ./data:/app/data
      - ./runs:/app/runs
      - hf-cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/dossierdev
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  hf-cache:
  neo4j-data:

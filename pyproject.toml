[project]
name = "dossier"
version = "0.1.0"
description = "Agentic due-diligence copilot over SEC filings with cited, guard-checked answers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arin Kathapurkar" }]

dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "datasets>=2.19",
    "pypdf>=4.2",
    "pymupdf>=1.24",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "lancedb>=0.13",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    "rapidfuzz>=3.9",
    "neo4j>=5.20",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
    # Line counting for the README's size figures, so they are a command rather than a claim.
    "pygount>=1.6",
]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
dossier = "dossier.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dossier"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
